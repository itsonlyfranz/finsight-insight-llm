# LoRA fine-tune of Qwen2.5-1.5B-Instruct with mlx-lm. Run via scripts/train.sh
model: models/Qwen2.5-1.5B-Instruct
train: true
data: data
fine_tune_type: lora
optimizer: adamw
seed: 0
num_layers: 28            # adapt all 28 transformer blocks
batch_size: 4
iters: 600                # ~1.5 epochs over the 1,618 training examples
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 30
  warmup_init: 1.0e-6
  arguments: [2.0e-5, 600, 2.0e-6]
max_seq_length: 768
mask_prompt: true         # loss on the assistant reply only
steps_per_report: 20
steps_per_eval: 100
val_batches: -1           # full validation set at each eval
save_every: 100
adapter_path: artifacts/adapters
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
